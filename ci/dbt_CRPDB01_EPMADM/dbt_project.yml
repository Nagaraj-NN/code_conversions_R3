name: dbt_CRPDB01_EPMADM_CI
version: 1.0.0
config-version: 2

profile: dbt_CRPDB01_EPMADM_CI

model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]

models:
  dbt_CRPDB01_EPMADM_CI:
    +materialized: view
    EPMADM:
      # The target's database, as the EPMADM and METADATA sources use: CRPDB01 on
      # dev / qa / uat / prod, CRPDB01_CI on ci, the sandbox when a run targets
      # one. A fixed CRPDB01 here sent a sandbox run's writes to CRPDB01 while it
      # read the sandbox (ci/f.txt, 2026-09-12).
      +database: "{{ target.database }}"
      +schema: EPMADM
      +materialized: table

vars:
  app_name_by_schema:
    EPMADM: EPMADM_CI
    METADATA: EPMADM_CI
    TEST_DBT_SCH: EPMADM_CI

on-run-start:
  - "{{ ci_ps_z_job_control() }}"

on-run-end:
  - "{{ mark_failed_jobs(results) }}"
