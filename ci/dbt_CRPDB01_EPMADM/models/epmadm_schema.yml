version: 2

# Source definitions for the CI conversion: wkf_LOAD_CI_ATOMIC and
# wkf_LOAD_CI_ATOMIC_AUDIT.
#
# CRPDB01_EPMADM and CRPDB01_METADATA resolve through {{ target.database }}, as
# the reference project's application schemas do, so dev / qa / uat / prod and
# the CI database follow the target. The validated scripts name
# CRPDB01_DEV_SANDBOX because that is the database they were executed in.
#
# CI_PSFT_SOURCE holds what the mappings READ from PeopleSoft. The validated
# scripts name those objects in EPMADM, but PeopleSoft is replicated to
# BRONZE_CORP_CONF.BRONZE_PEOPLESOFT, which is where this project - like the
# sibling EPMADM project dp-corp-ar80 - reads it. The database is pinned, as the
# reference project pins its BRONZE_* sources, so every target, CI included,
# reads the same bronze tables.
#
# PS_Z_JOB_CONTROL_CI is this application's own copy of PeopleSoft's
# PS_Z_JOB_CONTROL. PeopleSoft's lives in bronze, where it cannot be updated;
# macros/ci_ps_z_job_control.sql creates the copy from it on the first run and
# adds any JOBID it lacks, and the job-control models open, read and close the
# CI_D00 / CPP_D00 / CI_EST_F00 windows there.
#
# Bronze stores some object names in lower case. Those tables keep their
# upper-case name for source() and declare the stored name as a quoted
# identifier: PS_Z_JTP_RELATE_CI is stored as "ps_z_jtp_relate_ci" (reported by
# dbt on the 2026-09-12 run in CRPDB01_DEV_SANDBOX).
#
# PS_PERSONAL_D00 is in EPMADM: the GEN_STAT scripts that read it ran without
# error.

sources:

  - name: CRPDB01_EPMADM
    database: "{{ target.database }}"
    schema: EPMADM
    tables:
      - name: PS_Z_JOB_CONTROL_CI
      - name: PS_Z_CI_D00
      - name: PS_Z_CPP_D00
      - name: PS_Z_CI_EST_F00
      - name: PS_Z_CI_DELETE_LOG
      - name: PS_Z_CPP_DELETE_LOG
      - name: PS_Z_EPM_AUDIT
      - name: PS_Z_PDS_CI_DTL
      - name: PS_Z_PDS_CPP_DTL
      - name: PS_Z_PMRG_ANLS_TBL
      - name: PS_Z_PMRG_CPP_TBL
      - name: PS_Z_CI_GEN_STAT
      - name: PS_Z_CPP_GEN_STAT
      - name: PS_PERSONAL_D00

  - name: CI_PSFT_SOURCE
    database: BRONZE_CORP_CONF
    schema: BRONZE_PEOPLESOFT
    tables:
      - name: PS_Z_JOB_CONTROL
      - name: PS_Z_CI_CHG_LOG_VW
      - name: PS_Z_CPP_CH_LOG_VW
      - name: PS_Z_CI_REV_DTLVW
      - name: PS_Z_JTP_RELATE_CI
        identifier: ps_z_jtp_relate_ci
        quoting:
          identifier: true
      - name: PS_Z_CI_DTL_VW
      - name: PS_Z_CPP_DTL_VW
      - name: PS_Z_PDS_CI_VW
      - name: PS_Z_PDS_CPP_VW
      - name: PS_Z_IR_DETAIL_TBL
      - name: PS_Z_PMRG_ANLS_TBL
      - name: PS_Z_PMRG_CPP_TBL
      - name: PS_Z_CI_GEN_STAT
      - name: PS_Z_CPP_GEN_STAT

  - name: CRPDB01_METADATA
    database: "{{ target.database }}"
    schema: METADATA
    tables:
      - name: EPMADM_CI_JOB_CONTROL
      - name: EPMADM_CI_JOB_EXECUTION
      - name: EPMADM_CI_JOB_PARAMETERS
